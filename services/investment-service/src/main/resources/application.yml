server:
  port: ${SERVER_PORT:8096}

spring:
  application:
    name: investment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: investment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
        specific.avro.reader: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

platform:
  field-encryption:
    key: ${INVESTMENT_FIELD_ENCRYPTION_KEY}
  outbox:
    relay-interval-ms: 2000
    ce-source: lendbridge://investment-service

investment:
  min-ticket-kobo: ${INVESTMENT_MIN_TICKET_KOBO:500000}
  max-borrower-exposure-ratio: ${INVESTMENT_MAX_BORROWER_EXPOSURE_RATIO:0.20}

wallet-service:
  url: ${WALLET_SERVICE_URL:http://localhost:8091}

feign:
  client:
    config:
      wallet-service:
        connect-timeout: 300
        read-timeout: 1000

resilience4j:
  circuitbreaker:
    instances:
      walletService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
        minimum-number-of-calls: 5
  retry:
    instances:
      walletService:
        max-attempts: 2
        wait-duration: 100ms

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
