databaseChangeLog:
  - changeSet:
      id: 001-fact-tables
      author: lendbridge
      changes:
        - createTable:
            tableName: user_signup_fact
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: user_signup_fact
            indexName: idx_user_signup_fact_occurred_at
            columns:
              - column:
                  name: occurred_at

        - createTable:
            tableName: loan_pipeline_fact
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: loan_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: borrower_user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: amount_kobo
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: tenor_months
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: interest_rate_bps
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: loan_pipeline_fact
            indexName: idx_loan_pipeline_fact_status
            columns:
              - column:
                  name: status
        - createIndex:
            tableName: loan_pipeline_fact
            indexName: idx_loan_pipeline_fact_occurred_at
            columns:
              - column:
                  name: occurred_at

        - createTable:
            tableName: risk_grade_fact
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: loan_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: grade
                  type: varchar(1)
                  constraints:
                    nullable: false
              - column:
                  name: model_version
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: risk_grade_fact
            indexName: idx_risk_grade_fact_grade
            columns:
              - column:
                  name: grade
        - createIndex:
            tableName: risk_grade_fact
            indexName: idx_risk_grade_fact_occurred_at
            columns:
              - column:
                  name: occurred_at

        - createTable:
            tableName: investment_activity_fact
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: commitment_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: loan_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: lender_user_id
                  type: uuid
              - column:
                  name: amount_kobo
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: activity_type
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: investment_activity_fact
            indexName: idx_investment_activity_fact_occurred_at
            columns:
              - column:
                  name: occurred_at

        - createTable:
            tableName: kyc_decision_fact
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: decision
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: trust_tier
                  type: varchar(16)
              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: kyc_decision_fact
            indexName: idx_kyc_decision_fact_occurred_at
            columns:
              - column:
                  name: occurred_at
