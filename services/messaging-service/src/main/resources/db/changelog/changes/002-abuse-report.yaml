databaseChangeLog:
  - changeSet:
      id: 002-abuse-report
      author: lendbridge
      changes:
        - createTable:
            tableName: abuse_report
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: conversation_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: reporter_user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: abuse_report
            indexName: idx_abuse_report_status
            columns:
              - column:
                  name: status
