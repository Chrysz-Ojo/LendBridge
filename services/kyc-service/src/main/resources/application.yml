server:
  port: ${SERVER_PORT:8093}

spring:
  application:
    name: kyc-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

platform:
  field-encryption:
    key: ${KYC_FIELD_ENCRYPTION_KEY}
  outbox:
    relay-interval-ms: 2000
    ce-source: lendbridge://kyc-service

kyc:
  provider:
    primary: ${KYC_PROVIDER_PRIMARY:fake}
    secondary: ${KYC_PROVIDER_SECONDARY:fake}
  identity-hash:
    pepper: ${KYC_IDENTITY_HASH_PEPPER}

document-service:
  url: ${DOCUMENT_SERVICE_URL:http://localhost:8083}

smileidentity:
  base-url: ${SMILE_IDENTITY_BASE_URL:https://api.smileidentity.com}
  partner-id: ${SMILE_IDENTITY_PARTNER_ID:}
  api-key: ${SMILE_IDENTITY_API_KEY:}

dojah:
  base-url: ${DOJAH_BASE_URL:https://api.dojah.io}
  app-id: ${DOJAH_APP_ID:}
  secret-key: ${DOJAH_SECRET_KEY:}

prembly:
  base-url: ${PREMBLY_BASE_URL:https://api.prembly.com}
  api-key: ${PREMBLY_API_KEY:}
  app-id: ${PREMBLY_APP_ID:}

feign:
  client:
    config:
      document-service:
        connect-timeout: 300
        read-timeout: 1000

resilience4j:
  circuitbreaker:
    instances:
      kycProviderPrimary:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
        minimum-number-of-calls: 5
      documentService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
        minimum-number-of-calls: 5
  retry:
    instances:
      kycProviderPrimary:
        max-attempts: 2
        wait-duration: 100ms
      documentService:
        max-attempts: 2
        wait-duration: 100ms

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
