databaseChangeLog:
  - changeSet:
      id: 003-bank-account
      author: lendbridge
      changes:
        - createTable:
            tableName: bank_account
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: wallet_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: bank_code
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: bank_name
                  type: varchar(255)
              - column:
                  name: account_number_ciphertext
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: account_holder_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: verification_status
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: verified_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: bank_account
            indexName: idx_bank_account_wallet_id
            columns:
              - column:
                  name: wallet_id
