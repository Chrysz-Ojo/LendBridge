databaseChangeLog:
  - changeSet:
      id: 002-hold
      author: lendbridge
      changes:
        - createTable:
            tableName: hold
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: wallet_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: amount_kobo
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: reference
                  type: varchar(255)
              - column:
                  name: status
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: idempotency_key
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: released_at
                  type: TIMESTAMP WITH TIME ZONE
        - addUniqueConstraint:
            tableName: hold
            columnNames: idempotency_key
            constraintName: uq_hold_idempotency_key
        - createIndex:
            tableName: hold
            indexName: idx_hold_wallet_id_status
            columns:
              - column:
                  name: wallet_id
              - column:
                  name: status
