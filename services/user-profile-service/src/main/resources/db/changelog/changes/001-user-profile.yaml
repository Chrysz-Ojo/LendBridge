databaseChangeLog:
  - changeSet:
      id: 001-user-profile
      author: lendbridge
      changes:
        - createTable:
            tableName: user_profile
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: full_name
                  type: varchar(255)
              - column:
                  name: date_of_birth
                  type: date
              - column:
                  name: address_line
                  type: varchar(255)
              - column:
                  name: city
                  type: varchar(128)
              - column:
                  name: state
                  type: varchar(128)
              - column:
                  name: country
                  type: varchar(128)
              - column:
                  name: phone_ciphertext
                  type: text
              - column:
                  name: employment_status
                  type: varchar(32)
              - column:
                  name: employer_or_business_name
                  type: varchar(255)
              - column:
                  name: monthly_income_kobo
                  type: bigint
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: user_profile
            columnNames: user_id
            constraintName: uq_user_profile_user_id
        - createIndex:
            tableName: user_profile
            indexName: idx_user_profile_user_id
            columns:
              - column:
                  name: user_id
