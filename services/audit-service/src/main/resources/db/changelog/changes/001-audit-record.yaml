databaseChangeLog:
  - changeSet:
      id: 001-audit-record
      author: lendbridge
      changes:
        - createTable:
            tableName: audit_record
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: topic
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: aggregate_key
                  type: varchar(128)
              - column:
                  name: payload
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: recorded_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: kafka_partition
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: kafka_offset
                  type: bigint
                  constraints:
                    nullable: false
        - createIndex:
            tableName: audit_record
            indexName: idx_audit_record_topic_aggregate_key
            columns:
              - column:
                  name: topic
              - column:
                  name: aggregate_key
        - createIndex:
            tableName: audit_record
            indexName: idx_audit_record_occurred_at
            columns:
              - column:
                  name: occurred_at
