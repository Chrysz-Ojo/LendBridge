databaseChangeLog:
  - changeSet:
      id: 007-seed-loan-escrow-account
      author: lendbridge
      comment: >
        The funding saga's escrow hop (lender wallets -> escrow -> borrower wallet). One global
        account, migration-seeded for the same reason as 006's payment-clearing account: every
        consumer that posts against it (ledger-service's own InvestmentDisbursementReadyEvent
        consumer) calls JournalEntryService as a local in-process bean, not over HTTP, so there's
        no caller-JWT problem and no provisioning race to guard against. The literal UUID here
        must match com.lendbridge.ledger.ClearingAccounts.LOAN_ESCROW_NGN exactly.
      changes:
        - insert:
            tableName: account
            columns:
              - column:
                  name: id
                  value: b41261d8-1dd3-5c59-b2d1-d9b9bce9f942
              - column:
                  name: account_type
                  value: LOAN_ESCROW
              - column:
                  name: currency
                  value: NGN
              - column:
                  name: normal_balance
                  value: CREDIT
              - column:
                  name: owner_reference
                  value: platform:loan-escrow
              - column:
                  name: created_at
                  valueDate: 2026-01-01T00:00:00Z
  - changeSet:
      id: 007-seed-platform-fee-revenue-account
      author: lendbridge
      comment: >
        Where the origination fee carved out of every disbursement lands. The literal UUID here
        must match com.lendbridge.ledger.ClearingAccounts.PLATFORM_FEE_REVENUE_NGN exactly.
      changes:
        - insert:
            tableName: account
            columns:
              - column:
                  name: id
                  value: c52372e9-2ee4-6d6a-c3e2-eacacdfa0a53
              - column:
                  name: account_type
                  value: PLATFORM_FEE_REVENUE
              - column:
                  name: currency
                  value: NGN
              - column:
                  name: normal_balance
                  value: CREDIT
              - column:
                  name: owner_reference
                  value: platform:fee-revenue
              - column:
                  name: created_at
                  valueDate: 2026-01-01T00:00:00Z
