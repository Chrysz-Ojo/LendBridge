databaseChangeLog:
  - changeSet:
      id: 001-account
      author: lendbridge
      changes:
        - createTable:
            tableName: account
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: varchar(3)
                  constraints:
                    nullable: false
              - column:
                  name: normal_balance
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: owner_reference
                  type: varchar(255)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
