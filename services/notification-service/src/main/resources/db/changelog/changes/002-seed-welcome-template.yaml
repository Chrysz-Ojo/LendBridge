databaseChangeLog:
  - changeSet:
      id: 002-seed-welcome-template
      author: lendbridge
      changes:
        - insert:
            tableName: notification_template
            columns:
              - column: { name: id, value: "0f8c5a52-6f2e-4c1a-9b1e-3d2a7c9e0001" }
              - column: { name: event_type, value: USER_REGISTERED }
              - column: { name: channel, value: EMAIL }
