server:
  port: ${SERVER_PORT:8094}

spring:
  application:
    name: loan-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

platform:
  outbox:
    relay-interval-ms: 2000
    ce-source: lendbridge://loan-service

loan:
  tenor:
    min-months: ${LOAN_TENOR_MIN_MONTHS:1}
    max-months: ${LOAN_TENOR_MAX_MONTHS:24}
  rate:
    floor-bps: ${LOAN_RATE_FLOOR_BPS:500}
    cap-bps: ${LOAN_RATE_CAP_BPS:6000}
  trust-tier:
    tier1-limit-kobo: ${LOAN_TIER1_LIMIT_KOBO:20000000}
    tier2-limit-kobo: ${LOAN_TIER2_LIMIT_KOBO:100000000}
    tier3-limit-kobo: ${LOAN_TIER3_LIMIT_KOBO:500000000}
  listing:
    expiry-days: ${LOAN_LISTING_EXPIRY_DAYS:14}
  agreement:
    template-version: ${LOAN_AGREEMENT_TEMPLATE_VERSION:1}

kyc-service:
  url: ${KYC_SERVICE_URL:http://localhost:8093}

document-service:
  url: ${DOCUMENT_SERVICE_URL:http://localhost:8083}

feign:
  client:
    config:
      kyc-service:
        connect-timeout: 300
        read-timeout: 1000

resilience4j:
  circuitbreaker:
    instances:
      kycService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
        minimum-number-of-calls: 5
      documentService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
        minimum-number-of-calls: 5
  retry:
    instances:
      kycService:
        max-attempts: 2
        wait-duration: 100ms
      documentService:
        max-attempts: 2
        wait-duration: 100ms

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
