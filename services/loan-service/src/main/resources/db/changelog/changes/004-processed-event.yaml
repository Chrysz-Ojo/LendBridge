databaseChangeLog:
  - changeSet:
      id: 004-processed-event
      author: lendbridge
      comment: >
        loan-service's first Kafka consumers (the funding saga) — idempotency bookkeeping, same
        shape as every other service's own processed_event table.
      changes:
        - createTable:
            tableName: processed_event
            columns:
              - column:
                  name: event_id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: processed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
