databaseChangeLog:
  - changeSet:
      id: 007-mfa-enrollment
      author: lendbridge
      changes:
        - createTable:
            tableName: mfa_enrollment
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: method
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: secret_ciphertext
                  type: text
              - column:
                  name: status
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: activated_at
                  type: TIMESTAMP WITH TIME ZONE
        - addForeignKeyConstraint:
            baseTableName: mfa_enrollment
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_mfa_enrollment_user
        - createIndex:
            tableName: mfa_enrollment
            indexName: idx_mfa_enrollment_user_method_status
            columns:
              - column:
                  name: user_id
              - column:
                  name: method
              - column:
                  name: status
