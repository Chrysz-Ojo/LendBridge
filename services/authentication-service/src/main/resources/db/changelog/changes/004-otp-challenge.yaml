databaseChangeLog:
  - changeSet:
      id: 004-otp-challenge
      author: lendbridge
      changes:
        - createTable:
            tableName: otp_challenge
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: purpose
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: code_hash
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: max_attempts
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: consumed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: otp_challenge
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_otp_challenge_user
        - createIndex:
            tableName: otp_challenge
            indexName: idx_otp_challenge_user_purpose
            columns:
              - column:
                  name: user_id
              - column:
                  name: purpose
