databaseChangeLog:
  - changeSet:
      id: 003-consent-record
      author: lendbridge
      changes:
        - createTable:
            tableName: consent_record
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: consent_type
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: accepted_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: consent_record
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_consent_record_user
        - createIndex:
            tableName: consent_record
            indexName: idx_consent_record_user_id
            columns:
              - column:
                  name: user_id
