databaseChangeLog:
  - changeSet:
      id: 006-refresh-token
      author: lendbridge
      changes:
        - createTable:
            tableName: refresh_token
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: varchar(64)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_refresh_token_hash
              - column:
                  name: family_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: replaced_by_id
                  type: uuid
              - column:
                  name: issued_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: revoked_reason
                  type: varchar(32)
              - column:
                  name: device_info
                  type: varchar(512)
              - column:
                  name: ip_address
                  type: varchar(64)
        - addForeignKeyConstraint:
            baseTableName: refresh_token
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_refresh_token_user
        - createIndex:
            tableName: refresh_token
            indexName: idx_refresh_token_user_id
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: refresh_token
            indexName: idx_refresh_token_family_id
            columns:
              - column:
                  name: family_id
