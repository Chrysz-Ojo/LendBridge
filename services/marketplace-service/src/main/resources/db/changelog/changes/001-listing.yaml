databaseChangeLog:
  - changeSet:
      id: 001-listing
      author: lendbridge
      changes:
        - createTable:
            tableName: listing
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: borrower_user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: amount_kobo
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: interest_rate_bps
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: tenor_months
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: purpose
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: listed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: listing
            indexName: idx_listing_status
            columns:
              - column:
                  name: status
        - createIndex:
            tableName: listing
            indexName: idx_listing_amount_kobo
            columns:
              - column:
                  name: amount_kobo
        - createIndex:
            tableName: listing
            indexName: idx_listing_interest_rate_bps
            columns:
              - column:
                  name: interest_rate_bps
        - createIndex:
            tableName: listing
            indexName: idx_listing_tenor_months
            columns:
              - column:
                  name: tenor_months
