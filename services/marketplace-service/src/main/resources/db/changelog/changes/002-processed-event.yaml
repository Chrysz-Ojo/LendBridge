databaseChangeLog:
  - changeSet:
      id: 002-processed-event
      author: lendbridge
      changes:
        - createTable:
            tableName: processed_event
            columns:
              - column:
                  name: event_id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: processed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
