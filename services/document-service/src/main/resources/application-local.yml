# Local-development-only defaults. Never use these values outside a developer's own machine;
# production configuration must come entirely from environment variables (CLAUDE.md "no secrets
# in code").
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/document_db
    username: document_service
    password: local-dev-only-password

documents:
  storage:
    # LocalStack ignores credential values entirely; "test"/"test" is just the AWS CLI convention.
    access-key: test
    secret-key: test
