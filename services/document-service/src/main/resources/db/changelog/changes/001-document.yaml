databaseChangeLog:
  - changeSet:
      id: 001-document
      author: lendbridge
      changes:
        - createTable:
            tableName: document
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: owner_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: document_type
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: original_filename
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: size_bytes
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: checksum_sha256
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: object_key
                  type: varchar(512)
                  constraints:
                    nullable: false
              - column:
                  name: scan_status
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: document
            indexName: idx_document_owner_id
            columns:
              - column:
                  name: owner_id
