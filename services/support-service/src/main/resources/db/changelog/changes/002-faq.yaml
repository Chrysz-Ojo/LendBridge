databaseChangeLog:
  - changeSet:
      id: 002-faq
      author: lendbridge
      changes:
        - createTable:
            tableName: faq
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: category
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: question
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: answer
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: published
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: faq
            indexName: idx_faq_published
            columns:
              - column:
                  name: published
