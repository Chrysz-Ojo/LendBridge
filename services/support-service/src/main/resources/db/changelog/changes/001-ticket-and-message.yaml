databaseChangeLog:
  - changeSet:
      id: 001-ticket-and-message
      author: lendbridge
      changes:
        - createTable:
            tableName: ticket
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: subject
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: category_detail
                  type: varchar(500)
              - column:
                  name: status
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: attachment_document_id
                  type: uuid
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: ticket
            indexName: idx_ticket_user_id
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: ticket
            indexName: idx_ticket_status
            columns:
              - column:
                  name: status
        - createTable:
            tableName: ticket_message
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ticket_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: author_user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: author_role
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: body
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: ticket_message
            indexName: idx_ticket_message_ticket_id
            columns:
              - column:
                  name: ticket_id
              - column:
                  name: id
