databaseChangeLog:
  - changeSet:
      id: 005-reconciliation-run
      author: lendbridge
      changes:
        - createTable:
            tableName: reconciliation_run
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: provider
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: period_start
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: period_end
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(24)
                  constraints:
                    nullable: false
              - column:
                  name: total_provider_records
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: total_matched
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: total_breaks
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE
