databaseChangeLog:
  - changeSet:
      id: 003-payout
      author: lendbridge
      changes:
        - createTable:
            tableName: payout
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: wallet_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: wallet_ledger_account_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: bank_account_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: amount_kobo
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: varchar(3)
                  constraints:
                    nullable: false
              - column:
                  name: provider
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: provider_reference
                  type: varchar(255)
              - column:
                  name: status
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: idempotency_key
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: payout
            columnNames: idempotency_key
            constraintName: uq_payout_idempotency_key
        - createIndex:
            tableName: payout
            indexName: idx_payout_user_id
            columns:
              - column:
                  name: user_id
